[package]
name = "nanit-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Michael Henry <mhenry@michaelhenry.me>"]
license = "MIT"
description = "A lightweight, secure bridge connecting Nanit Baby Monitors to Home Assistant, Mosquitto, and go2rtc"
readme = "README.md"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prost = "0.13"
rumqttc = "0.24"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2.5"
anyhow = "1.0"
thiserror = "1.0"
inquire = "0.7"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.1"
